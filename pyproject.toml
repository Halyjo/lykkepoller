[project]
name = "lykkepoller"
version = "0.1.0"
description = "Minimal local-first live polling app for presentations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
    "qrcode[pil]>=7.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
lykkepoller = "lykkepoller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lykkepoller"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
