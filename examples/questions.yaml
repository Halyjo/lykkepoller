title: "Demo polling session"

questions:
  - id: q1
    type: multiple_choice
    prompt: "Which metric best captures missed oil spills?"
    # `is_correct: true` is optional. When set, the presenter can press C
    # (or click "Show correct" on /admin) to highlight the right answer in
    # green and dim the others. Multiple options can be marked correct.
    # If no option has is_correct, the toggle does nothing for this question.
    options:
      - id: A
        label: "Pixel accuracy"
      - id: B
        label: "Instance-wise recall"
        is_correct: true
      - id: C
        label: "Mean brightness"

  - id: q2
    type: free_text
    prompt: "What can go wrong if the metric does not match the real goal?"

  - id: q3
    type: multiple_choice
    prompt: "Pick a color (no correct answer here)"
    options:
      - id: red
        label: "Red"
      - id: blue
        label: "Blue"
      - id: green
        label: "Green"
