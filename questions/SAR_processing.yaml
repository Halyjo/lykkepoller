title: "SAR Processing"

questions:
  - id: q1
    type: multiple_choice
    prompt: "What best describes a SAR sensor?"
    options:
      - id: A
        is_correct: true
        label: "A radar"
      - id: B
        is_correct: false
        label: "An image sensor"
      - id: C
        is_correct: false
        label: "A timer"

  - id: q2
    type: free_text
    prompt: "What are the advantages of using SAR over optical sensors?"

  - id: q3
    type: multiple_choice
    prompt: "What is the center frequency of Sentinel 1?"
    options:
      - id: A
        is_correct: true
        label: "5.4 GHz"
      - id: B
        is_correct: false
        label: "10.2 GHz"
      - id: C
        is_correct: false
        label: "5.1 Hz"
      - id: D
        is_correct: false
        label: "6.8 Hz"